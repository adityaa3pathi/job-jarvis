[project]
name = "job-apply-agent"
version = "0.1.0"
description = "Local-first agent that finds, ranks and tailors job applications from a verified fact sheet."
requires-python = ">=3.12,<3.13"
dependencies = [
  "pyyaml>=6.0",
  "pydantic>=2.7",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
  "python-docx>=1.1",
  "pypdf>=4.0",
]

[project.optional-dependencies]
pdf = ["fpdf2>=2.7", "pypdf>=4.0"]
browser = [
    "playwright>=1.45",
]
agent = [
    "langgraph>=0.2",
]
turso = [
    "libsql>=0.1",
]
embed = [
    "fastembed>=0.7,<0.10",
]

[project.scripts]
job-agent = "jobagent.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML",
  "types-beautifulsoup4",
  "fpdf2>=2.7",
  "pypdf>=4.0",
  "libsql>=0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "evals", "."]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["libsql"]
ignore_missing_imports = true
