# Daily job search at 09:00 IST. The call also wakes the free Render service.
name: daily-discover
on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger discovery on the API
        env:
          API_URL: ${{ secrets.JOBAGENT_API_URL }}
          TOKEN: ${{ secrets.JOBAGENT_CRON_TOKEN }}
        run: |
          curl --fail-with-body --retry 3 --retry-delay 30 --retry-all-errors --max-time 120 \
            -X POST -H "Authorization: Bearer $TOKEN" "$API_URL/api/cron/discover"
