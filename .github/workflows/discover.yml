# Daily job search, run here: on Render's small CPU it starved the health check. Writes the
# Turso runs table, so the web Jobs page shows progress and result. Fails when the run fails.
# Started by workflow_dispatch: cron-job.org at 08:53 IST (GitHub's own schedule started
# 7-10 h late), and "Find new jobs" on the web. The schedule below is only a backup: it
# skips itself when a dispatched run already succeeded today (IST) or is still running.
name: daily-discover
on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
permissions:
  contents: read
  actions: read  # the backup's check of today's runs
concurrency:
  group: daily-discover
jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != schedule ]; then echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          since=$(date -u -d "$(TZ=Asia/Kolkata date +%F) 00:00 +0530" +%Y-%m-%dT%H:%M:%SZ)
          n=$(gh run list -R "$GITHUB_REPOSITORY" --workflow discover.yml \
                --event workflow_dispatch --created ">=$since" --json conclusion,status \
                --jq '[.[] | select(.conclusion == "success" or .status != "completed")] | length')
          echo "dispatched runs since $since (IST midnight): $n"
          echo "skip=$([ "$n" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
  discover:
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45  # keep under STALE_RUN_S in web/store.py (50 min)
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      # Optional: without them the AI judge and the Telegram digest are skipped.
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.fastembed
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen --extra agent --extra turso --extra embed
      - uses: actions/cache@v4
        with:
          path: .fastembed
          key: fastembed-bge-small-en-v1.5
      - name: Run discovery
        run: |
          set -euo pipefail
          test -n "$TURSO_DATABASE_URL" || { echo "::error::TURSO_DATABASE_URL is not set"; exit 1; }
          export JOBAGENT_DATA_DIR="$RUNNER_TEMP/jobagent/data"
          export JOBAGENT_CONFIG_DIR="$RUNNER_TEMP/jobagent/config"
          # NEW lines, then the summary: portals, drops, notes, unreachable boards, digest.
          uv run --no-sync job-agent discover | tee "$RUNNER_TEMP/discover.txt"
      - name: Run summary
        if: always()
        run: |
          test -f "$RUNNER_TEMP/discover.txt" || exit 0
          { echo '```'; grep -v '^NEW ' "$RUNNER_TEMP/discover.txt" || true; echo '```'; } \
            >> "$GITHUB_STEP_SUMMARY"
