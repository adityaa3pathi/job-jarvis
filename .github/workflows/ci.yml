# Every push and PR: Python tests, lint, format and types; web types, lint, theme checks and build.
name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen --all-extras
      # facts.yaml is personal and git-ignored; the example file has the same shape.
      - run: test -f facts.yaml || cp facts.example.yaml facts.yaml
      - run: uv run pytest -q
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy src
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint src
      - run: node scripts/no-raw-colors.mjs
      - run: node scripts/contrast-check.mjs
      - run: npx next build
        env:
          API_URL: http://127.0.0.1:8000
          NEXT_TELEMETRY_DISABLED: "1"
