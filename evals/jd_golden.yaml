  text: "**About Us**\nBusinessonbot is a fast-growing B2B SaaS platform doing $1.5M ARR, serving D2C\
    \ brands across India for WhatsApp-first marketing, support automation, and AI-powered customer journeys.\
    \ Our stack connects WhatsApp, Instagram, Messenger, Email, and Voice channels to e-commerce platforms\
    \ (Shopify, WooCommerce), payments, and CRM — all in real-time, at scale, for hundreds of active business\
    \ clients. \nWe move fast, operate lean, and take reliability seriously because downtime for our clients\
    \ means lost revenue\n**Role**\nWe're looking for an AI Engineer who can own our agent stack end to\
    \ end — design, build, ship, and keep it healthy in production.\nThis is not a research role. You\
    \ won't be reading papers and running benchmarks in a notebook. Our AI agents talk to real customers\
    \ of real D2C brands, on WhatsApp and on voice, about their orders and their money. When an agent\
    \ hallucinates a discount code or loops on a tool call, a business owner notices and a customer is\
    \ unhappy. So the job is: build agents that work reliably, prove they work with evals and traces,\
    \ keep them from doing dumb or dangerous things with guardrails, and do all of it without the inference\
    \ bill quietly doubling every quarter.\nYou'll be the person who holds the entire agent architecture\
    \ in their head. That means being independent — you'll get direction on what the product needs, not\
    \ a spec for how to build it\n**What You'll Own**\n1. Agent Architecture, End to End\n* Own the design\
    \ and implementation of production LLM agents — tool calling, memory, state, multi-step reasoning,\
    \ handoff to humans\n* Build and maintain Python/FastAPI services that expose these agents to our\
    \ platform, reliably and at low latency\n* Decide agent boundaries: what's one agent vs. many, what's\
    \ a tool vs. a workflow step, what should never be an LLM call at all\n* Integrate with our core backend,\
    \ messaging channels, and e-commerce/CRM data sources so agents actually have the context they need\n\
    2. RAG & Retrieval Quality\n* Build and own retrieval pipelines — chunking, embedding, indexing, reranking,\
    \ refresh strategy\n* Debug retrieval failures properly: is it the chunking, the query, the index,\
    \ or the prompt? Know how to tell the difference\n* Handle multi-tenant data isolation in retrieval\
    \ as a correctness and security requirement, not an afterthought\n* Keep retrieval fresh as brand\
    \ catalogs, policies, and offers change\n3. Guardrails & Safety"
