  text: '**About the company :**

    **ToolJet** is an AI platform that empowers teams to build and deploy internal tools in minutes -
    turning ideas into business applications faster than ever. With 35K+ stars on GitHub, we’re one of
    the most loved open source platforms in the developer community. We partner with industry leaders
    - from telecom giants, to financial institutions, to cutting-edge unicorns and startups across the
    globe.

    Our 50+ member team works across the US and India, building at the intersection of AI and productivity.
    Backed by Microsoft’s M12, Nexus Venture Partners, January Capital, and Ratio Ventures, we’re on a
    mission to redefine how businesses create software - faster, smarter, and more accessible for everyone.

    **Responsibilities**

    * Design, build, and maintain robust backend services, REST APIs, and data pipelines that power ToolJet''s
    platform at scale.

    * Own the full data lifecycle including schema design, query optimization, indexing strategies, and
    migrations using PostgreSQL as the primary database.

    * Build and maintain scalable server-side architecture using Node.js and NestJS, applying clean code
    principles and strong separation of concerns.

    * Collaborate with Product Managers and Frontend Engineers to define API contracts and deliver reliable,
    high-performance integrations.

    * Identify and resolve performance bottlenecks across the backend stack, from slow queries and N+1
    problems to memory leaks and latency spikes.

    **What we are looking for:**

    * 3+ years of experience in backend or fullstack engineering with a strong backend focus.

    * Deep hands-on expertise with Node.js and NestJS, with a proven track record of shipping production-grade
    services.

    * Strong proficiency in TypeScript and JavaScript, with a habit of writing type-safe, well-structured
    code by default.

    * Solid command of PostgreSQL including complex queries, indexing, query planning, transactions, and
    schema design.

    * Familiarity with ORM and query builder tools such as TypeORM, Prisma, or Knex.

    * A sound understanding of database performance patterns and how to apply them in production environments.

    * Strong grasp of SOLID principles, RESTful API design, and building services that are maintainable
    and extensible.

    * Experience with caching strategies using Redis and message queues such as BullMQ, RabbitMQ, or Kafka
    is a strong plus.'
