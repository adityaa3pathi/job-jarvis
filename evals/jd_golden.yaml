  text: 'Read This Before Anything Else

    We have 6 developers who can ship. What we don''t have is someone who turns that into a real engineering
    function: real architecture, real leverage, real AI-driven advantage. If that gap sounds like an opportunity
    rather than a headache, you''re in the right place. If it sounds like a lot of undefined work with
    no playbook handed to you, this one probably isn''t for you. That''s completely okay. There are plenty
    of great roles that fit differently.

    About CraftMyPlate

    CraftMyPlate is Hyderabad''s go-to platform for food experiences for micro-events: house parties,
    birthdays, office celebrations, festive gatherings, and more. We''re building the operating system
    for how India discovers, customises, and orders food for smaller events. We''re backed by established
    founders and investors, and we''re funded and growing fast. The next phase of that growth runs through
    engineering.

    Where We Stand

    Some numbers, because they matter more than adjectives. Order volume has grown 50x in two years, and
    we''re compounding at roughly 3x year over year, without giving up equity to fund it. That means the
    business runs on its own economics. The growth is real demand, not runway bought with dilution, and
    every efficient architectural decision this role makes directly protects that.

    Most people size up an opportunity by asking what''s going to change in ten years. The more useful
    question, and the one this company is built around, is what won''t change. People will keep gathering.
    They''ll keep celebrating, hosting, and marking festivals, in 10 years and in 20. That permanence
    is the bet. You''re not building infrastructure for a trend cycle. You''re building for a category
    that outlasts the current AI wave, the next funding round, and probably us too.

    The Technical Reality

    Here''s an honest read of the engineering problem, not a sanitized version of it.

    Event-driven commerce doesn''t scale like typical e-commerce. Demand isn''t smooth, it''s spiky: weekends,
    festival calendars, and event dates create real load concentration, and each order is tied to a hard
    deadline that can''t slip the way a shipped package can. That has direct architectural consequences:
    systems need to handle bursty, unpredictable traffic without paying for idle capacity the rest of
    the time, which is exactly why we''re serverless-first on AWS rather than running a fixed fleet sized
    for peak.'
