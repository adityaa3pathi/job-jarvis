bullets:
  # --- summaries ---
  - {id: ai-summary, kind: summary, parent: null, text: "AI and backend engineer. Built an AI email assistant with hybrid retrieval, an agent with a step cap, a fine-tuned classifier and an MCP server. Also ships production healthcare software with payments, refunds and a mobile app, used by 2500+ patients across 50+ cities.", verbs: [built, ships], scope_words: [production], numbers: [n-patients, n-cities], source: "resume-ai-engineer.md, Summary", confirmed: true}
  - {id: fs-summary, kind: summary, parent: null, text: "Full-stack engineer. Ships Next.js and React interfaces, Node.js backends and a React Native app. Built a healthcare platform with payments, refunds and doctor consultations, used by 2500+ patients across 50+ cities.", verbs: [ships, built], scope_words: [], numbers: [n-patients, n-cities], source: "resume-full-stack.md, Summary", confirmed: true}

  # --- AI track, DocNow ---
  - {id: ai-docnow-1, parent: role-docnow, text: "Designed and deployed an agentic booking assistant with LangGraph: a planner node, a retrieval node (hybrid BM25 + pgvector with reranking over 1100+ tests and packages), an action node that calls booking APIs, and a verifier node that abstains when not grounded.", verbs: [designed, deployed], scope_words: [], numbers: [n-catalog-1100], source: "resume-ai-engineer.md, DocNow bullet 1 (marked confirm)", confirmed: false}
  - {id: ai-docnow-2, parent: role-docnow, text: "Added state and loop control: Redis-backed memory, per-turn context trimming, retry on low confidence, and a 5-step loop cap to bound latency and cost.", verbs: [added], scope_words: [], numbers: [n-docnow-stepcap], source: "resume-ai-engineer.md, DocNow bullet 2 (marked confirm)", confirmed: false}
  - {id: ai-docnow-3, parent: role-docnow, text: "Built an 80-query golden-set eval with automated scoring for faithfulness, context precision and hallucination rate, run in CI on every deploy.", verbs: [built], scope_words: [], numbers: [n-golden-80, n-faithfulness, n-hallucination], source: "resume-ai-engineer.md, DocNow bullet 3 (marked confirm)", confirmed: false}
  - {id: ai-docnow-4, parent: role-docnow, text: "Added Langfuse tracing per agent node, prompt versioning, and production sampling for drift checks.", verbs: [added], scope_words: [production], numbers: [], source: "resume-ai-engineer.md, DocNow bullet 4 (marked confirm)", confirmed: false}
  - {id: ai-docnow-5, parent: role-docnow, text: "Built the doctor-consultation feature end to end: booking with a held slot, Razorpay payments confirmed on the server, tiered refunds, a staff review queue, and a background job that repairs stuck payments. 300+ automated tests across server, web and mobile.", verbs: [built], scope_words: [end_to_end], numbers: [n-tests-300], source: "resume-ai-engineer.md, DocNow bullet 5", confirmed: true}
  - {id: ai-docnow-6, parent: role-docnow, text: "Delivered 147 production APIs (Node.js, Python FastAPI, PostgreSQL) with idempotent webhooks, retry queues and dead-letter recovery.", verbs: [delivered], scope_words: [production], numbers: [n-apis-147], source: "resume-ai-engineer.md, DocNow bullet 6 (marked confirm)", confirmed: false}
  - {id: ai-badaya-1, parent: role-badaya, text: "Moved the app to the Next.js App Router. Built REST APIs and tuned PostgreSQL queries with connection pooling.", verbs: [moved, built, tuned], scope_words: [], numbers: [n-badaya-40], source: "resume-ai-engineer.md, Badaya (marked: 40% faster - confirm)", confirmed: false}
  # --- AI track, Email Assistant ---
  - {id: ai-email-1, parent: proj-email, text: "Hybrid retrieval: pgvector with an HNSW index plus BM25 full-text search, with reranking and metadata filters. Embeddings from Gemini.", verbs: [], scope_words: [], numbers: [], source: "resume-ai-engineer.md, Projects", confirmed: true}
  - {id: ai-email-2, parent: proj-email, text: "Agent in Python with LangGraph and tools for search, calendar lookup and reply drafting, capped at 5 steps.", verbs: [], scope_words: [], numbers: [n-email-stepcap], source: "resume-ai-engineer.md, Projects", confirmed: true}
  - {id: ai-email-3, parent: proj-email, text: "Fine-tuning pipeline for an email classifier with QLoRA on Mistral, served with vLLM, with a router that picks between the fine-tuned model and Gemini 2.0 Flash Lite.", verbs: [], scope_words: [], numbers: [], source: "resume-ai-engineer.md, Projects", confirmed: true}
  - {id: ai-email-4, parent: proj-email, text: "MCP server that exposes email search, calendar and drafting as tools to any MCP client.", verbs: [], scope_words: [], numbers: [], source: "resume-ai-engineer.md, Projects", confirmed: true}
  - {id: ai-email-5, parent: proj-email, text: "Background ingestion with Inngest step functions and per-account concurrency limits. Deployed with Kubernetes manifests and autoscaling.", verbs: [deployed], scope_words: [], numbers: [], source: "resume-ai-engineer.md, Projects", confirmed: true}

  # --- full stack track, DocNow ---
  - {id: fs-docnow-1, parent: role-docnow, text: "Shipped features end to end across customer, manager and super-admin interfaces: 147 production APIs and 50 Next.js 16 / React 19 pages.", verbs: [shipped], scope_words: [end_to_end, production], numbers: [n-apis-147, n-pages-50, n-nextjs-16, n-react-19], source: "resume-full-stack.md, DocNow bullet 1 (marked confirm)", confirmed: false}
  - {id: fs-docnow-2, parent: role-docnow, text: "Built doctor consultations on web and mobile: doctor sign-up and approval, weekly hours and leave, slot booking with a held slot, Razorpay checkout with server-confirmed payment state, tiered refunds, and an admin review queue.", verbs: [built], scope_words: [], numbers: [], source: "resume-full-stack.md, DocNow bullet 2", confirmed: true}
  - {id: fs-docnow-3, parent: role-docnow, text: "Made payments safe: idempotent webhooks, a repair job for stuck payments and refunds, and screens that never show \"failed\" while money may have moved.", verbs: [made], scope_words: [], numbers: [], source: "resume-full-stack.md, DocNow bullet 3", confirmed: true}
