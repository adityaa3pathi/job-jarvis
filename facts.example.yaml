  - {id: fs-docnow-7, parent: role-docnow, text: "Built 30 role-gated dashboard pages with order tracking, CSV bulk import and authenticated S3 report streaming.", verbs: [built], scope_words: [], numbers: [n-dashboards-30], source: "resume-full-stack.md, DocNow bullet 7 (marked confirm)", confirmed: false}
  - {id: fs-docnow-8, parent: role-docnow, text: "Designed a 26-table PostgreSQL schema with idempotent webhooks, lease-based locking, retry queues and dead-letter recovery.", verbs: [designed], scope_words: [], numbers: [n-tables-26, n-uptime-9999], source: "resume-full-stack.md, DocNow bullet 8 (marked: 99.99% - confirm)", confirmed: false}
  - {id: fs-docnow-9, parent: role-docnow, text: "Integrated Razorpay, Healthians, WhatsApp and AWS S3. Deployed on AWS EC2 with Nginx, PM2 and Cloudflare.", verbs: [integrated, deployed], scope_words: [], numbers: [n-uptime-999], source: "resume-full-stack.md, DocNow bullet 9 (marked: 99.9% uptime - confirm)", confirmed: false}
  - {id: fs-badaya-1, parent: role-badaya, text: "Led the move to the Next.js App Router. Built secure APIs and tuned Prisma and PostgreSQL queries.", verbs: [led, built, tuned], scope_words: [lead], numbers: [], source: "resume-full-stack.md, Badaya", confirmed: true}
