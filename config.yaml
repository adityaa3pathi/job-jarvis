# Plan "Outstanding Questions" defaults. All are proposals the owner has not yet confirmed.
daily_cap: 5
per_portal_limit: 3
min_pause_s: 20
retention_days: 90
years_rounding: down
fit_bar: 4
max_years_asked: 6
freetext_questions: pause_all
llm:
  provider: gemini
  model: gemini-3.5-flash-lite
  timeout_s: 30
  send_contact_details: false
  # On AWS: Nova answers when Gemini fails. Check the model id in the Bedrock console.
  # bedrock_model: global.amazon.nova-2-lite-v1:0
  # bedrock_region: ap-south-1
ranking:
  fit_score: 62  # 0-100 score at which a found job counts as a fit (web shows it green)
  owner_years: 2  # DocNow since 06-2024; jobs asking 4+ years score 40 at most, 6+ are dropped
discovery:
  # Stage 4 filters on new jobs, each off until the owner approves it after seeing what it
  # drops (evals/run_discovery_eval.py). Drop reasons: off_target_title, outside_india.
  title_filter: false  # keywords + embedding similarity to the target roles
  title_margin: 0.05
  region_words: false  # "US Remote"/"EMEA" in the title; Seoul, Taipei, "americas", "eu"
  social_location: false  # Bluesky/Mastodon/Telegram/Reddit: place read from the post text
outreach:
  jobs_per_day: 10
  first_emails_per_day: 20
  linkedin_invites_per_day: 20
  people_per_company: 2
  follow_up_days: [4, 10]
